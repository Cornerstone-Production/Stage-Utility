# Versioning and releases, driven by Conventional Commits.
#
# beta  -> a prerelease  X.Y.Z-beta.N   (tag + GitHub prerelease)
# main  -> the release   X.Y.Z          (tag + GitHub release)
#
# The level comes from the commits since the last tag, per docs/contributing.md:
#   feat            -> minor
#   fix | perf      -> patch
#   `!` or BREAKING -> major
#   everything else -> no release
#
# TAG-DRIVEN ON PURPOSE. This never rewrites branch history — it commits the
# version bump forward and tags it. Deployments track `beta` and a force-push
# would break their in-app updater.

name: Release

on:
  push:
    branches: [beta, main]

# Two pushes in quick succession must not both try to tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Decide the version
        id: version
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          CURRENT=$(node -p "require('./package.json').version")

          # Last release tag reachable from here; empty on the very first run.
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          RANGE=${LAST:+$LAST..HEAD}
          echo "last tag: ${LAST:-<none>}  range: ${RANGE:-<all history>}"

          SUBJECTS=$(git log --no-merges --format='%s' $RANGE)
          BODIES=$(git log --no-merges --format='%b' $RANGE)

          LEVEL=none
          if grep -qE '^(feat|fix|perf|refactor|docs|test|build|ci|chore)(\([^)]+\))?!:' <<<"$SUBJECTS" \
             || grep -q 'BREAKING CHANGE' <<<"$BODIES"; then
            LEVEL=major
          elif grep -qE '^feat(\([^)]+\))?:' <<<"$SUBJECTS"; then
            LEVEL=minor
          elif grep -qE '^(fix|perf)(\([^)]+\))?:' <<<"$SUBJECTS"; then
            LEVEL=patch
          fi
          echo "level: $LEVEL"

          if [ "$LEVEL" = none ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Nothing user-visible since ${LAST:-the beginning} — no release."
            exit 0
          fi

          # Strip any prerelease suffix to get the base X.Y.Z.
          BASE=${CURRENT%%-*}
          IFS=. read -r MA MI PA <<<"$BASE"
          case "$LEVEL" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          NEXT="$MA.$MI.$PA"

          if [ "$BRANCH" = beta ]; then
            # Count existing prereleases of this base so N always moves forward.
            N=$(git tag -l "v$NEXT-beta.*" | wc -l | tr -d ' ')
            NEXT="$NEXT-beta.$((N+1))"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "next: $NEXT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"

      - name: Verify before tagging
        if: steps.version.outputs.skip == 'false'
        run: npm ci --include=dev && npm run lint && npm run type-check && npm test && npm run build

      - name: Bump, tag and push
        if: steps.version.outputs.skip == 'false'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "$V" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore(release): v$V [skip ci]"
          git tag "v$V"
          # Push the branch fast-forward only, then the tag. Never a force.
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v$V"

      - name: Publish the release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
          LAST: ${{ steps.version.outputs.last }}
          PRE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES=$(git log --no-merges --format='- %s' ${LAST:+$LAST..}HEAD~1 || true)
          gh release create "v$V" \
            --title "v$V" \
            --notes "${NOTES:-No notable changes.}" \
            $([ "$PRE" = true ] && echo --prerelease || echo --latest)
