name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

# Least privilege, stated rather than inherited: the repository default is
# read today, but a settings change should not silently widen every workflow.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Fails the PR that introduces a known-vulnerable dependency, rather than
      # waiting for a dependabot alert once it has already merged. High and
      # critical only: moderate findings in build tooling are noise that would
      # train people to ignore this.
      - name: Audit dependencies
        run: npm audit --audit-level=high
