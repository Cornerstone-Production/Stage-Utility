name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

# Least privilege, stated rather than inherited: the repository default is
# read today, but a settings change should not silently widen every workflow.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinning is only worth anything if it holds. It already slipped once: the
      # references pinned in one PR were complete, and a second PR merged
      # afterwards carrying a new job with a fresh mutable tag. Nothing noticed.
      - name: Every action is pinned to a commit SHA
        run: |
          set -euo pipefail
          bad=$(grep -rnE "uses: [^ ]+@(v[0-9]+|main|master)([^0-9a-f]|$)" .github/workflows/ || true)
          if [ -n "$bad" ]; then
            echo "::error::a mutable action reference can be repointed at new code — pin it to a commit SHA"
            echo "$bad"
            exit 1
          fi
          echo "all actions pinned"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Fails the PR that introduces a known-vulnerable dependency, rather than
      # waiting for a dependabot alert once it has already merged. High and
      # critical only: moderate findings in build tooling are noise that would
      # train people to ignore this.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Informational, never a gate.
      #
      # A percentage threshold rewards tests written to touch lines rather than
      # to catch bugs, which is the opposite of what the suite does today. What
      # this is for is visibility: the HTTP route handlers are the least-covered
      # code in the project and the only LAN-facing surface, which is where the
      # prototype-pollution bug lived. A PR that drops one further should be
      # visible in the log without failing anyone's build.
      - name: Coverage (routes and services)
        continue-on-error: true
        run: |
          set -uo pipefail
          node --import tsx --test --experimental-test-coverage \
            "main/**/*.test.ts" "renderer/**/*.test.ts" "scripts/**/*.test.ts" \
            > /tmp/cov.txt 2>&1 || true

          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep "all files" /tmp/cov.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Least-covered server modules — the LAN-facing surface:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          awk '/start of coverage report/,/end of coverage report/' /tmp/cov.txt \
            | grep -oE "[a-z0-9-]+\.tsx? +\| +[0-9.]+" \
            | awk '{gsub(/\|/,""); print $2, $1}' | sort -n | head -10 \
            >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          grep "all files" /tmp/cov.txt || true
