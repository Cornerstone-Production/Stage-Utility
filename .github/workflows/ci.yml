name: CI

on:
  # Pull requests only. A push to beta or main is gated by release.yml, which
  # runs the same four steps over the merged tree before it tags, and marks the
  # commit it pushes with a `build` status. Running this workflow on the push as
  # well was the same suite over the same tree a second time (and, via the
  # dispatch release.yml used to make, a third).
  #
  # The release PR (head beta, base main) is skipped below: its head is a beta
  # commit that release.yml has already verified and marked, and the merge to
  # main is verified again by release.yml before the stable tag is cut.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Lets a specific commit be verified on demand.
  workflow_dispatch:

# Least privilege, stated rather than inherited: the repository default is
# read today, but a settings change should not silently widen every workflow.
permissions:
  contents: read

# Four jobs run side by side so the slowest one sets the wait, not the sum:
# lint, type-check, build and audit in one; the test suite split four ways across
# the others (Node's --test-shard, with the file patterns in scripts/run-tests.mjs
# only); the ServiceCue Worker package, which has its own dependencies and so its
# own install, type-check, audit and test, in one; and `build`, which passes only
# when all of them did. The suite is most of the time: every test file runs in its
# own process, on a 4-core runner. Coverage used to run the suite a second time
# here; it is informational and moved to coverage.yml on a schedule.
#
# `build` keeps the single name release.yml writes as a commit status, so a PR
# and the release PR read the same check. release.yml does not run the Worker's
# job: nothing in a release builds or deploys it.
jobs:
  checks:
    name: lint, type-check, build
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'beta' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinning is only worth anything if it holds. It already slipped once: the
      # references pinned in one PR were complete, and a second PR merged
      # afterwards carrying a new job with a fresh mutable tag. Nothing noticed.
      - name: Every action is pinned to a commit SHA
        run: |
          set -euo pipefail
          bad=$(grep -rnE "uses: [^ ]+@(v[0-9]+|main|master)([^0-9a-f]|$)" .github/workflows/ || true)
          if [ -n "$bad" ]; then
            echo "::error::a mutable action reference can be repointed at new code — pin it to a commit SHA"
            echo "$bad"
            exit 1
          fi
          echo "all actions pinned"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      # Fails the PR that introduces a known-vulnerable dependency, rather than
      # waiting for a dependabot alert once it has already merged. High and
      # critical only: moderate findings in build tooling are noise that would
      # train people to ignore this.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  test:
    name: test (${{ matrix.shard }}/4)
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'beta' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to the end, so one PR shows every failing test, not the
      # first quarter's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The suite asks git questions about history. A release-notes override
          # names a commit and the guard beside it checks that the commit is
          # actually reachable, which is the whole point -- a typo'd SHA that
          # silently does nothing is the failure it exists to catch. In a
          # shallow clone the object is not there, so the check cannot answer
          # and the guard reports a failure it has no business reporting.
          # secret-scan.yml and commit-lint.yml already take the whole history
          # for the same kind of reason.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --test-shard=${{ matrix.shard }}/4

  # The public ServiceCue Worker (publish/servicecue/). It is a package of its own,
  # with its own lockfile, and the root checks above cannot reach what it needs: the
  # root `tsc` and `npm test` cover the parts of the Worker that import no Workers
  # API, and this covers the rest. `worker.ts`, `hub.ts` and `env.ts` import
  # `cloudflare:workers` and are only type-checked by the package's own tsc; the
  # Durable Object's storage and the viewers' sockets are only real in workerd, which
  # the package's test starts locally with `wrangler dev`. Nothing is sent to
  # Cloudflare, and there is no account or token in this job.
  #
  # The package's dependencies are installed first and the Worker's checks run on
  # them alone: the type-check includes the shared contract
  # (main/types/servicecue-publish.ts), which imports nothing, and the test builds its
  # own stand-in for the page. The root dependencies come after, for the two tests at
  # the end that need both packages or a PowerShell: the bundle against wrangler, and
  # the update scripts run whole.
  worker:
    name: worker (install, type-check, audit, test)
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'beta' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    # The one job that starts a long-lived process (workerd). The test kills it when it
    # ends; this is for the day it does not, so a hang costs fifteen minutes and not
    # the runner's six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            publish/servicecue/package-lock.json
            package-lock.json

      - name: Install the Worker's dependencies
        run: npm --prefix publish/servicecue ci

      - name: Type-check
        run: npm --prefix publish/servicecue run typecheck

      # The same bar the root package is held to: a known-vulnerable dependency fails
      # the PR that brings it, high and critical only.
      - name: Audit dependencies
        run: npm --prefix publish/servicecue audit --audit-level=high

      - name: Test
        run: npm --prefix publish/servicecue test

      # The bundle a server uploads (build/servicecue) against what `wrangler deploy
      # --dry-run` produces. It needs the root package's build tooling as well as the
      # Worker's wrangler, which no other job has both of; the root shards skip it.
      - name: Install the root dependencies
        run: npm ci --include=dev

      - name: The bundle is what wrangler uploads
        run: node --import tsx --test scripts/servicecue-bundle-wrangler.test.ts
        env:
          SERVICECUE_REQUIRE_WRANGLER: "1"

      # update.sh and update.ps1 run whole against a scratch git repository. ubuntu-latest
      # ships pwsh, so a missing one here is a failure and not a skip.
      - name: The update scripts rebuild when they should
        run: node --import tsx --test scripts/update-scripts.test.ts
        env:
          UPDATE_REQUIRE_PWSH: "1"

  # The one check that says the whole gate passed. It runs whatever the others
  # did, so a failed shard turns it red rather than leaving it skipped; a
  # cancelled run stays cancelled rather than reading as a failure; and a skipped
  # gate (the release PR) skips it too.
  build:
    needs: [checks, test, worker]
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && github.head_ref == 'beta' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Every check, every test shard and the Worker package passed
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.test.result }}
          WORKER: ${{ needs.worker.result }}
        run: |
          echo "lint, type-check, build: $CHECKS"
          echo "tests: $TESTS"
          echo "worker: $WORKER"
          if [ "$CHECKS" != success ] || [ "$TESTS" != success ] || [ "$WORKER" != success ]; then
            echo "::error::the gate did not pass"
            exit 1
          fi
