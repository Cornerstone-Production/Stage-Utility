# Fails a PR that introduces a credential, and re-checks the whole history weekly.
#
# Runs the gitleaks binary directly rather than gitleaks-action, which gates
# organisation use behind a licence key. Same scanner, one less dependency, and
# nothing to renew.
#
# Two scopes, deliberately. A PR is scanned over only its own commits — fast, and
# it fails the person who can still fix it. The scheduled run covers every ref,
# because a rule added to gitleaks after a commit landed would otherwise never be
# applied to it.
#
# Each scan also writes SARIF, uploaded to code scanning so a finding shows in the
# Security tab and not only in this log. The upload never changes the verdict: it
# runs whatever the scan found, and the scan step is what fails the job. A fork or
# Dependabot pull request cannot write to code scanning, so for those the log is
# the only report. Both scans keep --redact, so the SARIF carries no secret.

name: Secret scan

on:
  pull_request:
  push:
    branches: [main, beta]
  schedule:
    - cron: "17 6 * * 1" # Mondays, off the hour to avoid the rush
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
    env:
      CAN_UPLOAD: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history — a shallow clone scans nothing useful

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Keep the published filename: sha256sum -c resolves the name written in
          # the checksums file, so renaming the download makes verification fail.
          curl -fsSL -o "$tarball"      "${base}/${tarball}"
          curl -fsSL -o checksums.txt   "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Integrity of the download, against a truncated or corrupted fetch.
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Only what this PR adds. The base ref is fetched by fetch-depth: 0.
            RANGE="origin/${BASE_REF}..HEAD"
            # A range that does not resolve would scan nothing and pass, which is
            # the one failure mode a scanner must not have. Fail loudly instead.
            git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null \
              || { echo "::error::base ref origin/${BASE_REF} not found — refusing to report a vacuous pass"; exit 1; }
            echo "scanning $RANGE ($(git rev-list --count "$RANGE") commits)"
            LOG_OPTS="$RANGE"
          else
            # Every branch and tag. Merge commits are skipped by gitleaks because
            # they carry no content their parents do not already have.
            echo "scanning all refs"
            LOG_OPTS="--all"
          fi
          gitleaks git . --log-opts="$LOG_OPTS" --redact --verbose \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks-history.sarif"

      - name: Scan the working tree
        # Catches anything committed in a form the history scan would miss, and
        # any file present but untracked. The report goes to the runner's temp
        # directory: written into the tree it would be scanned by this very step.
        run: |
          gitleaks dir . --redact --verbose \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks-tree.sarif"

      # `!cancelled()`, not the default `success()`, so a scan that found something
      # still uploads. A scan that never ran leaves no file and the upload fails on
      # top of a job that is already red.
      - name: Upload the history scan to code scanning
        if: ${{ !cancelled() && env.CAN_UPLOAD == 'true' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/gitleaks-history.sarif
          category: gitleaks-history

      - name: Upload the working-tree scan to code scanning
        if: ${{ !cancelled() && env.CAN_UPLOAD == 'true' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/gitleaks-tree.sarif
          category: gitleaks-tree
