# The Mac output helper's Swift package (helper/macos): built and tested on a macOS
# runner, for every pull request that touches it.
#
# ci.yml runs on Ubuntu and never builds the helper, so its tests ran only on a
# developer's Mac. This builds the package and runs ./test.sh: the core and
# DeckLinkKit tests. Neither needs CEF (the browser host is opened at run time, not
# linked) or Desktop Video (each driver test says which it needs and is skipped
# without it). A runner with no Metal device skips the GPU conversion tests with
# that reason, rather than failing them.
#
# Tested by scripts/helper-macos-workflow.test.ts, which runs these steps' own shell.

name: Mac output helper

on:
  pull_request:
    paths:
      - "helper/**"
      - ".github/workflows/helper-macos.yml"
  # Lets a specific commit be verified on demand.
  workflow_dispatch:

# Least privilege, stated rather than inherited.
permissions:
  contents: read

jobs:
  swift:
    name: helper swift build and tests
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # swift-testing comes with Swift 6, which is Xcode 16; the image's default
      # Xcode may be older. The newest Xcode 16 or later on the image is used, or the
      # job fails saying there is none.
      - name: Select Xcode 16 or later
        run: |
          set -euo pipefail
          apps="${XCODE_APPS:-/Applications}"
          xcode=$(ls -d "$apps"/Xcode_*.app 2>/dev/null | grep -E '/Xcode_(1[6-9]|[2-9][0-9])(\.[0-9]+)*\.app$' | sort -V | tail -n 1 || true)
          if [ -z "$xcode" ]; then
            echo "::error title=Mac output helper::no Xcode 16 or later on this runner; the helper's tests need Swift 6's swift-testing"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          echo "using $xcode"
          swift --version

      - name: Build and test the helper
        run: cd helper/macos && swift build && ./test.sh
