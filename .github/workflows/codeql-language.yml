# One language's CodeQL analysis, called by codeql.yml.
#
# With `run` true it analyses the language. With `run` false, on a pull request, it
# uploads an empty result under the same category instead. Code scanning compares a
# pull request with the configurations the base branch has; one the pull request
# lacks turns the "CodeQL" check neutral ("N configurations not found") and no
# alert in it can be judged. An empty result for the category is the configuration,
# found, with nothing new in it.
#
# That upload is never made on a push. There it would tell code scanning the
# language has no alerts on the branch, and close the ones it has.
#
# Every language reads .github/codeql/codeql-config.yml: the extended suite, and the
# paths it ignores. JavaScript/TypeScript also loads the model pack beside it
# (.github/codeql/extensions), which the action has no input for: it is passed to
# the CLI through CODEQL_ACTION_EXTRA_OPTIONS.

name: CodeQL language

on:
  workflow_call:
    inputs:
      language:
        description: The CodeQL language identifier, which is also the category suffix.
        type: string
        required: true
      run:
        description: Analyse the language. When false, a pull request gets an empty result.
        type: boolean
        required: true
      runner:
        type: string
        default: ubuntu-latest
      build-mode:
        description: >-
          none, or manual for a language the CodeQL tracer must watch being built (the
          steps for it are below, keyed on the language).
        type: string
        default: none

permissions:
  contents: read

# Job names are static: a job skipped by its `if` is shown with its name unevaluated,
# so an expression in one renders as literal text. The caller's job id, which the
# check name is prefixed with ("swift / Analyze"), is what names the language.
jobs:
  analyze:
    name: Analyze
    if: ${{ inputs.run }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before init, so the tracer watches the Swift the helper is released with. The
      # image's default Xcode may be older than the Swift 6 the package needs.
      - name: Select Xcode
        if: ${{ inputs.build-mode == 'manual' }}
        uses: $/.github/actions/select-xcode
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      # What the tracer watches. The Swift leg builds the whole package, which also
      # compiles the DeckLink shim; the C/C++ leg builds only the shim and the vendored
      # SDK dispatch it links, so it does not repeat the Swift build on a second macOS
      # runner.
      - name: Build the Swift helper
        if: ${{ inputs.build-mode == 'manual' && inputs.language == 'swift' }}
        working-directory: helper/macos
        run: swift build
      - name: Build the DeckLink shim
        if: ${{ inputs.build-mode == 'manual' && inputs.language == 'c-cpp' }}
        working-directory: helper/macos
        run: swift build --target DeckLinkShim
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        env:
          # The model pack targets codeql/javascript-all, so only the JavaScript run
          # loads it. A second --additional-packs is added to whatever the action
          # passes itself, not substituted for it.
          CODEQL_ACTION_EXTRA_OPTIONS: ${{ inputs.language == 'javascript-typescript' && format('{{"database":{{"run-queries":["--additional-packs={0}/.github/codeql/extensions","--model-packs=stage-utility/javascript-models"]}}}}', github.workspace) || '' }}
        with:
          category: "/language:${{ inputs.language }}"

  # No checkout and no CodeQL: it needs nothing but a runner that is not scarce.
  empty-result:
    name: Empty result
    if: ${{ !inputs.run && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Write an empty result
        run: |
          cat >empty.sarif <<'SARIF'
          {"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"CodeQL","informationUri":"https://codeql.github.com/"}},"results":[]}]}
          SARIF
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: empty.sarif
          category: "/language:${{ inputs.language }}"
