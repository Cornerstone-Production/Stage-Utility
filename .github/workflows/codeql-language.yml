# One language's CodeQL analysis, called by codeql.yml.
#
# With `run` true it analyses the language. With `run` false, on a pull request, it
# uploads an empty result under the same category instead. Code scanning compares a
# pull request with the configurations the base branch has; one the pull request
# lacks turns the "CodeQL" check neutral ("N configurations not found") and no
# alert in it can be judged. An empty result for the category is the configuration,
# found, with nothing new in it.
#
# That upload is never made on a push. There it would tell code scanning the
# language has no alerts on the branch, and close the ones it has.

name: CodeQL language

on:
  workflow_call:
    inputs:
      language:
        description: The CodeQL language identifier, which is also the category suffix.
        type: string
        required: true
      run:
        description: Analyse the language. When false, a pull request gets an empty result.
        type: boolean
        required: true
      runner:
        type: string
        default: ubuntu-latest
      build-mode:
        type: string
        default: none

permissions:
  contents: read

# Job names are static: a job skipped by its `if` is shown with its name unevaluated,
# so an expression in one renders as literal text. The caller's job id, which the
# check name is prefixed with ("swift / Analyze"), is what names the language.
jobs:
  analyze:
    name: Analyze
    if: ${{ inputs.run }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ inputs.language }}"

  # No checkout and no CodeQL: it needs nothing but a runner that is not scarce.
  empty-result:
    name: Empty result
    if: ${{ !inputs.run && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Write an empty result
        run: |
          cat >empty.sarif <<'SARIF'
          {"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"CodeQL","informationUri":"https://codeql.github.com/"}},"results":[]}]}
          SARIF
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: empty.sarif
          category: "/language:${{ inputs.language }}"
