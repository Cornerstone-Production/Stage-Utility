# The CodeQL configuration for every language codeql.yml analyses.
#
# paths-ignore removes a file from the database for JavaScript/TypeScript (and Ruby):
# no alert in it, and no flow through it. Swift and C/C++ do not support path filtering
# (CodeQL logs "Path filters have no effect"), so the helper entries below are inert
# today; they state what should be dropped if a SARIF filter is ever added, and no
# alert sits under them now. Nothing that ships belongs here.
#
# Tests are ignored although they call route handlers directly, which is the only path
# CodeQL has into handlers (see the model pack's route-sources.model.yml). With the
# models loaded, ignoring them changed no alert in product code. It did surface one in
# a test harness, so harnesses and fixtures are listed too.
#
# Tested by scripts/codeql-workflow.test.ts. Documented in docs/contributing.md.

name: Stage Utility CodeQL configuration

# The extended suite, which is what GitHub's default setup ran here.
queries:
  - uses: security-extended

paths-ignore:
  # Blackmagic's DeckLink SDK headers and dispatch, vendored (see the README beside
  # them). Not ours to fix.
  - helper/macos/Vendor/**
  # Tests, and the code that exists only to run them. A hard-coded credential or a
  # loose regular expression in a test is not a defect in the product, and a harness
  # that wraps console.warn is a second place a real flow lands.
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*-harness.ts"
  - "**/*-harness.tsx"
  - "**/*-fixture.ts"
  - "**/*-test-helpers.ts"
  - renderer/test-dom.ts
  - renderer/main/test-render-ctx.ts
  - renderer/test-fixtures/**
  - main/services/fixtures/**
  - helper/macos/Tests/**
  - helper/macos/Fixtures/**
  # The model pack's own CodeQL tests: fixtures that log a request unsanitised on
  # purpose, so the scan of the repository would report each of them.
  - .github/codeql/tests/**
  # The docs screenshot tool: it drives the app with fake vendor servers and its
  # product is the PNGs in docs/images. It is never part of what ships.
  - scripts/docs-screenshots/**
  # Generated by a build, never committed: the Vite and bundle output, SwiftPM's
  # checkouts and generated sources (the manual Swift build writes them inside the
  # workspace the analysis then reads), the assembled helper app, and the CEF
  # download and CMake build of the browser host.
  - build/**
  - .vite/**
  - helper/macos/.build/**
  - helper/macos/dist/**
  - helper/macos/.cef/**
  - helper/macos/.cef-build/**
