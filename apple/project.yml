# XcodeGen spec — run `xcodegen generate` in apple/ to produce StageDisplay.xcodeproj.
# (Install: `brew install xcodegen`.) You can also create the project by hand in
# Xcode instead — see README.md. The .xcodeproj itself is git-ignored.
name: StageDisplay

options:
  bundleIdPrefix: com.cornerstonelife
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
    macOS: "26.0"

settings:
  base:
    # Swift 5 language mode: keeps the AVFoundation/NDI C-interop bridging free of
    # Swift 6 strict-concurrency friction on first build. Migrate to 6.0 later.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  StageDisplay:
    type: application
    # One multiplatform app target → tvOS appliance, iPad confidence, Mac window.
    supportedDestinations: [iOS, tvOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      tvOS: "26.0"
      macOS: "26.0"
    sources:
      - path: StageDisplay
    # Static Info.plist (generated by XcodeGen, git-ignored) so we can set the ATS
    # exception that lets plain-HTTP reach the LAN server (required on iOS/tvOS).
    info:
      path: StageDisplay/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Local Network permission copy + NDI mDNS discovery.
        NSLocalNetworkUsageDescription: "Stage Display connects to your Stage Utility server and NDI video sources on the local network."
        NSBonjourServices: ["_ndi._tcp"]
        # Allow HTTP to LAN hosts/.local/IP literals without TLS (the server is HTTP on the LAN).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    postBuildScripts:
      # The macOS NDI lib is a dylib with install name @rpath/libndi.dylib, so it
      # must live inside the app bundle at runtime. Copy + ad-hoc sign it into
      # Contents/Frameworks (where LD_RUNPATH_SEARCH_PATHS points). macOS only —
      # iOS/tvOS link the static .a, which needs no embedding.
      - name: Embed NDI dylib (macOS)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" = "macosx" ]; then
            FRAMEWORKS="$CODESIGNING_FOLDER_PATH/Contents/Frameworks"
            mkdir -p "$FRAMEWORKS"
            cp -f "$SRCROOT/Vendor/NDI/lib/macOS/libndi.dylib" "$FRAMEWORKS/"
            codesign --force --sign - "$FRAMEWORKS/libndi.dylib" || true
          fi
    settings:
      base:
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES

        # ── NDI SDK wiring ──────────────────────────────────────────────────
        # Drop the SDK under apple/Vendor/NDI/ (git-ignored). `import NDI`
        # resolves via NDISupport/module.modulemap, which flips on the real
        # receive pipeline (#if canImport(NDI)).
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/NDISupport"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/NDI/include"
        # Embed @rpath libs (macOS dylib) so the app finds libndi at runtime.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/Frameworks"

        # The link library name differs per platform, so link conditionally.
        "LIBRARY_SEARCH_PATHS[sdk=macosx*]": "$(SRCROOT)/Vendor/NDI/lib/macOS"
        "OTHER_LDFLAGS[sdk=macosx*]": "-lndi"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/Vendor/NDI/lib/iOS"
        "OTHER_LDFLAGS[sdk=iphoneos*]": "-lndi_ios"
        "LIBRARY_SEARCH_PATHS[sdk=appletvos*]": "$(SRCROOT)/Vendor/NDI/lib/tvOS"
        "OTHER_LDFLAGS[sdk=appletvos*]": "-lndi_tvos"
        # NOTE: the iOS/tvOS .a are device-only (no simulator slice); build for a
        # device, or stub NDI on the simulator. macOS runs in the simulator-free
        # path. Embed Vendor/NDI/lib/macOS/libndi.dylib via a Copy Files (Frameworks)
        # phase for a distributable macOS build.
