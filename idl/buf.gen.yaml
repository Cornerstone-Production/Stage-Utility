version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../server/internal/connecthandlers/gen
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go
    out: ../server/internal/connecthandlers/gen
    opt:
      - paths=source_relative
      - package_suffix=
