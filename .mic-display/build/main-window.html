<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stage Monitor</title>
    <script>
      // Kiosk TV display is always dark, regardless of system appearance,
      // so component text tokens (--foreground) resolve to light values.
      document.documentElement.classList.add("dark");
    </script>
    <style>
      /* Kiosk TV display: deep dark gradient background for depth */
      :root,
      .dark {
        --background: #080810;
      }
      html,
      body,
      #root {
        background: radial-gradient(ellipse 120% 80% at 50% 0%, #0f0f1a 0%, #080810 55%, #040408 100%);
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
    </style>
    <script type="module" crossorigin src="./assets/main-window-DhmoxOGW.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/styles-qlMrWfX5.js">
    <link rel="stylesheet" crossorigin href="./assets/styles-CL-MBJ1V.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Preload is injected by the native layer via webPreferences.preload -->
  </body>
</html>
