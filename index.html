<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <!-- Tint the mobile browser chrome dark to match the kiosk UI. -->
    <meta name="theme-color" content="#080810" />
    <!-- Add to Home Screen → standalone (no browser bars), edge-to-edge. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stage Utility" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Stage Utility</title>
    <script>
      // Kiosk TV display is always dark, regardless of system appearance.
      document.documentElement.classList.add("dark");
    </script>
    <style>
      :root, .dark {
        --background: #080810;
      }
      html, body, #root {
        /* Solid color FIRST so iOS fills the standalone safe areas (status bar /
           home indicator) dark — a gradient alone has no background-color, which
           iOS treats as white (the "white bars"). The gradient layers on top. */
        background-color: #080810;
        background-image: radial-gradient(ellipse 120% 80% at 50% 0%, #0f0f1a 0%, #080810 55%, #040408 100%);
        /* Use the DYNAMIC viewport for the whole chain so it matches the views'
           h-[100dvh]. `100%`/`100vh` resolve to the LARGE viewport on iOS, which
           is taller than the visible area when the toolbars show — that mismatch
           left the parent's background peeking out below the view (empty space). */
        height: 100%;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./renderer/main/index.tsx"></script>
  </body>
</html>
