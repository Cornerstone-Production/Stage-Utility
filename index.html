<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <!-- ONE value, dark, on purpose: the kiosk is always dark regardless of
         system appearance (see the theme script below). The operator app in
         app.html is the one that follows the theme and declares both.
         #0a0a0a is --kiosk-bg, and is strictly R=G=B. -->
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Add to Home Screen → standalone (no browser bars). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- `default`, not `black-translucent`.
         black-translucent puts the web view UNDER the status bar and leaves iOS
         to keep the clock legible over whatever is there — which it does with a
         translucent scrim, and that scrim is the blur across the top of the app
         on a home-screen install. `default` gives an opaque status bar tinted by
         theme-color above the web view: no scrim, no guessing, and the space it
         occupies stops being ours to pad around. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stage Utility" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Stage Utility</title>
    <script>
      // Kiosk TV display is always dark, regardless of system appearance.
      // `kiosk` scopes the stage design tokens (near-black surfaces, white-opacity
      // text) — see the .kiosk overrides in renderer/styles.css.
      document.documentElement.classList.add("dark", "kiosk");
      // A settings preview (Screens page, view editor) runs this SAME document
      // inside a small <iframe>. `overscroll-behavior: none` below is right for
      // a REAL display — full-window, nowhere to hand a scroll gesture off to —
      // and exactly backwards for a preview: Safari reads it as the iframe
      // refusing to let a wheel gesture over it chain out to the page embedding
      // it, so hovering a preview stops the whole Screens page from scrolling.
      // This has to run before first paint, not from a React effect after the
      // preview's bundle has loaded: LazyPreview (renderer/settings/sections/
      // lazy-preview.tsx) mounts a fresh iframe every time a card scrolls into
      // view, so an effect-based fix would leave the broken window open again
      // on every card — right when the operator is scrolling.
      //
      // "preview-" is a THIRD copy of RESERVED_SLUG_PREFIX
      // (main/services/reserved-slugs.ts) / PREVIEW_PREFIX
      // (renderer/main/preview-url.ts) — spelled again rather than imported for
      // the same reason preview-url.ts gives for its own copy: this script runs
      // before any module graph exists at all. kiosk-preview-boot.test.ts
      // guards the three staying in sync by running this exact script, not by
      // matching its text.
      if (location.pathname.startsWith("/preview-")) {
        document.documentElement.classList.add("kiosk-preview");
      }
    </script>
    <style>
      :root, .dark {
        --background: #0a0a0a;
      }
      html, body, #root {
        /* Flat near-black so every view matches the slots view (no gradient).
           Solid color also fills the iOS standalone safe areas (status bar /
           home indicator) dark instead of white. Neutral #0a0a0a (= --kiosk-bg),
           not the blue-tinted #080810. */
        background-color: #0a0a0a;
        /* Use the DYNAMIC viewport for the whole chain so it matches the views'
           h-[100dvh]. `100%`/`100vh` resolve to the LARGE viewport on iOS, which
           is taller than the visible area when the toolbars show — that mismatch
           left the parent's background peeking out below the view (empty space). */
        height: 100%;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      /* The preview case the script above marks — the opposite of the rule
         above, and ONLY the opposite: nothing else about a preview's kiosk
         document should differ from the real display it is a picture of. */
      .kiosk-preview, .kiosk-preview body, .kiosk-preview #root {
        overscroll-behavior: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./renderer/main/index.tsx"></script>
  </body>
</html>
