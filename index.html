<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <!-- Tint the mobile browser chrome to match the page, PER SCHEME.
         One hardcoded dark value told the browser "this app is near-black" while
         the app was rendering light, which is what put a dark cast across the top
         of a light page on a phone. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e0e" />
    <!-- Add to Home Screen → standalone (no browser bars). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- `default`, not `black-translucent`.
         black-translucent puts the web view UNDER the status bar and leaves iOS
         to keep the clock legible over whatever is there — which it does with a
         translucent scrim, and that scrim is the blur across the top of the app
         on a home-screen install. `default` gives an opaque status bar tinted by
         theme-color above the web view: no scrim, no guessing, and the space it
         occupies stops being ours to pad around. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stage Utility" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Stage Utility</title>
    <script>
      // Kiosk TV display is always dark, regardless of system appearance.
      // `kiosk` scopes the stage design tokens (near-black surfaces, white-opacity
      // text) — see the .kiosk overrides in renderer/styles.css.
      document.documentElement.classList.add("dark", "kiosk");
    </script>
    <style>
      :root, .dark {
        --background: #0a0a0a;
      }
      html, body, #root {
        /* Flat near-black so every view matches the slots view (no gradient).
           Solid color also fills the iOS standalone safe areas (status bar /
           home indicator) dark instead of white. Neutral #0a0a0a (= --kiosk-bg),
           not the blue-tinted #080810. */
        background-color: #0a0a0a;
        /* Use the DYNAMIC viewport for the whole chain so it matches the views'
           h-[100dvh]. `100%`/`100vh` resolve to the LARGE viewport on iOS, which
           is taller than the visible area when the toolbars show — that mismatch
           left the parent's background peeking out below the view (empty space). */
        height: 100%;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./renderer/main/index.tsx"></script>
  </body>
</html>
