<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stage Monitor</title>
    <script>
      // Kiosk TV display is always dark, regardless of system appearance.
      document.documentElement.classList.add("dark");
    </script>
    <style>
      :root, .dark {
        --background: #080810;
      }
      html, body, #root {
        background: radial-gradient(ellipse 120% 80% at 50% 0%, #0f0f1a 0%, #080810 55%, #040408 100%);
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./renderer/main/index.tsx"></script>
  </body>
</html>
