<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <title>Stage Utility — Settings</title>
    <script>
      // Apply the saved theme before paint (no flash). Falls back to the OS
      // preference when the user hasn't chosen one. Mirrors the key used by
      // the in-app toggle (THEME_STORAGE_KEY in settings-view.tsx).
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("stage-utility-theme"); } catch (e) {}
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <style>
      :root {
        --background: hsl(0 0% 100% / 0.9);
      }
      .dark {
        --background: hsl(0 0% 0% / 0.4);
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: var(--background);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./renderer/settings/index.tsx"></script>
  </body>
</html>
